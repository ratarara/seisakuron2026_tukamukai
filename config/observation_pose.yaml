# 撮影姿勢（#47）：カメラを真下に向けて、4×4 の置き場とケースを全部写す姿勢。
# IK で計算した値。実機のカメラではまだ確かめていない（2026-11-02）。
#
# カメラの位置：x = 0.240, y = 0.100, 高さ 0.26 m（真下向き。画像の長辺が左右）
# 写る範囲：前後 200 mm × 左右 357 mm（D435 のカラー 69° × 42° からの計算）
# 写したい範囲：前後 120 mm × 左右 280 mm（配置図 docs/fill_4x4_layout.png）
# 高さ 0.30 m 以上は、手首の上下の関節（-90° まで）が届かず解がない
